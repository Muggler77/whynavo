name: Configure WhyNavo Production Email

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whynavo-production-database-access
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
      AUTH_EMAIL_FROM: WhyNavo <account@auth.whynavo.com>
      AUTH_EMAIL_PUBLIC_APP_URL: https://whynavo.com/
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Verify encrypted credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$RESEND_API_KEY"
          test -n "$SEND_EMAIL_HOOK_SECRET"
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.101.0
      - name: Configure encrypted Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
        run: node scripts/configure-supabase-function-secrets.mjs
      - name: Deploy reviewed Send Email Hook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-auth-email --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Configure signed Auth email delivery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET }}
        run: npm run configure:supabase-email
      - name: Verify production email and security gates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verify:supabase-production -- --phase predeploy
