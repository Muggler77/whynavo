name: Publish whytab Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: vars.WHYTAB_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: whytab-production-database-access
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify data migration
        run: node scripts/migration-safety-test.mjs
      - name: Verify Edge Function syntax
        run: npm run verify:edge-functions
      - name: Verify encrypted backup tooling
        run: npm run verify:backup-tools

      - name: Verify repository privacy and secret boundaries
        run: |
          npm run verify:repository-safety
          npm run verify:public-images
      - name: Verify public repository history
        run: npm run verify:repository-history

      - name: Verify official production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whytab.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whytab.pages.dev/captcha.html
        run: npm run verify:production-config

      - name: Apply backward-compatible database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations -- --through 0012

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Deploy backward-compatible Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Verify release metadata
        run: npm run verify:release

      - name: Build production package
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whytab.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whytab.pages.dev/captcha.html
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Create Chrome and Edge archive
        working-directory: extension/dist
        run: zip -r "../../whytab-${GITHUB_REF_NAME}-chrome-web-store.zip" . -x '*.DS_Store'

      - name: Create SHA-256 checksum
        run: sha256sum "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip" > "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip.sha256"

      - name: Attest release provenance
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: "whytab-${{ github.ref_name }}-chrome-web-store.zip"

      - name: Prepare private draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$release_state" = "false" ]; then
            echo "::error::A public release already exists for ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$release_state" = "true" ]; then
            gh release upload "${GITHUB_REF_NAME}" \
              "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip#Chrome and Edge unpacked extension" \
              "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip.sha256#SHA-256 checksum" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "whytab ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
              --draft
          else
            gh release create "${GITHUB_REF_NAME}" \
              "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip#Chrome and Edge unpacked extension" \
              "whytab-${GITHUB_REF_NAME}-chrome-web-store.zip.sha256#SHA-256 checksum" \
              --title "whytab ${GITHUB_REF_NAME}" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
              --verify-tag \
              --draft
          fi

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
