name: Encrypted Production Database Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whytab-production-database-access
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify backup credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN \
            BACKUP_ENCRYPTION_PUBLIC_KEY_B64 \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            R2_ENDPOINT \
            R2_BUCKET
          do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          case "$R2_ENDPOINT" in
            https://*.r2.cloudflarestorage.com) ;;
            *) echo "::error::R2_ENDPOINT must be the Cloudflare R2 S3 endpoint"; exit 1 ;;
          esac

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Export roles, schema, and data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssl_config="$(supabase --experimental ssl-enforcement get --project-ref "$SUPABASE_PROJECT_REF")"
          jq -e '.currentConfig.database == true and .appliedSuccessfully == true' <<<"$ssl_config" >/dev/null \
            || { echo "::error::Supabase database SSL enforcement is disabled"; exit 1; }
          runner_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            || { echo "::error::Cannot determine the backup runner IPv4 address"; exit 1; }
          supabase --experimental network-restrictions update \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --db-allow-cidr "$runner_ip/32" \
            --yes
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          mkdir -p .backup-work/database
          supabase db dump --linked -f .backup-work/database/roles.sql --role-only
          supabase db dump --linked -f .backup-work/database/schema.sql
          supabase db dump \
            --linked \
            -f .backup-work/database/data.sql \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          tar -C .backup-work/database -czf .backup-work/whytab-database.tar.gz \
            roles.sql schema.sql data.sql
      - name: Close direct database ingress
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          supabase --experimental network-restrictions update \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --db-allow-cidr "0.0.0.0/32" \
            --bypass-cidr-checks \
            --yes

      - name: Encrypt and validate backup
        env:
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup_id="$(date -u +'%Y-%m-%dT%H-%M-%SZ')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BACKUP_ID=$backup_id" >> "$GITHUB_ENV"
          node scripts/backup-envelope.mjs \
            encrypt \
            .backup-work/whytab-database.tar.gz \
            ".backup-work/${backup_id}.tar.gz.enc"
          node scripts/backup-envelope.mjs inspect ".backup-work/${backup_id}.tar.gz.enc"
          sha256sum ".backup-work/${backup_id}.tar.gz.enc" \
            > ".backup-work/${backup_id}.tar.gz.enc.sha256"

      - name: Upload ciphertext to private R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          prefix="production/$(date -u +'%Y/%m/%d')"
          aws s3 cp \
            ".backup-work/${BACKUP_ID}.tar.gz.enc" \
            "s3://${R2_BUCKET}/${prefix}/${BACKUP_ID}.tar.gz.enc" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream \
            --no-progress
          aws s3 cp \
            ".backup-work/${BACKUP_ID}.tar.gz.enc.sha256" \
            "s3://${R2_BUCKET}/${prefix}/${BACKUP_ID}.tar.gz.enc.sha256" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain \
            --no-progress
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "${prefix}/${BACKUP_ID}.tar.gz.enc" \
            --endpoint-url "$R2_ENDPOINT" \
            --query '{ContentLength:ContentLength,ETag:ETag}' \
            --output json

      - name: Remove plaintext working files
        if: always()
        shell: bash
        run: |
          find .backup-work -type f -delete 2>/dev/null || true
          rm -rf .backup-work
