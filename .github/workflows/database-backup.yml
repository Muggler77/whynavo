name: Encrypted Production Database Backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whynavo-production-database-access
  cancel-in-progress: false

jobs:
  backup:
    if: vars.WHYNAVO_PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify backup credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN \
            BACKUP_ENCRYPTION_PUBLIC_KEY_B64 \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            R2_ENDPOINT \
            R2_BUCKET
          do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          case "$R2_ENDPOINT" in
            https://*.r2.cloudflarestorage.com) ;;
            *) echo "::error::R2_ENDPOINT must be the Cloudflare R2 S3 endpoint"; exit 1 ;;
          esac

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Configure temporary database access
        id: jit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          runner_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            || { echo "::error::Cannot determine the backup runner IPv4 address"; exit 1; }
          profile="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/profile)"
          jit_user_id="$(jq -r '.gotrue_id // empty' <<<"$profile")"
          [[ "$jit_user_id" =~ ^[0-9a-fA-F-]{36}$ ]] \
            || { echo "::error::Supabase token profile has no valid project user id"; exit 1; }
          jit_state="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit-access")"
          jit_was_enabled=false
          if jq -e '.state == "enabled" and .appliedSuccessfully == true' <<<"$jit_state" >/dev/null; then
            jit_was_enabled=true
          else
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"state":"enabled"}' \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit-access" \
              >/dev/null
            jit_state="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit-access")"
            jq -e '.state == "enabled" and .appliedSuccessfully == true' <<<"$jit_state" >/dev/null \
              || { echo "::error::Supabase temporary database access did not apply"; exit 1; }
          fi
          expires_at="$(( $(date +%s) + 1800 ))000"
          curl --fail --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn \
              --arg user_id "$jit_user_id" \
              --arg cidr "$runner_ip/32" \
              --argjson expires_at "$expires_at" \
              '{
                user_id: $user_id,
                user_roles: [{
                  role: "postgres",
                  allowed_networks: {
                    allowed_cidrs: [{ cidr: $cidr }],
                    allowed_cidrs_v6: []
                  },
                  expires_at: $expires_at
                }]
              }')" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit" \
            >/dev/null
          {
            echo "JIT_USER_ID=$jit_user_id"
            echo "JIT_WAS_ENABLED=$jit_was_enabled"
          } >> "$GITHUB_ENV"

      - name: Export roles, schema, and data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ingress_open=false
          close_ingress() {
            if [ "$ingress_open" != "true" ]; then
              return 0
            fi
            set +e
            supabase --experimental network-restrictions update \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --db-allow-cidr "0.0.0.0/32" \
              --bypass-cidr-checks \
              --yes
            close_status=$?
            set -e
            if [ "$close_status" -eq 0 ]; then
              ingress_open=false
            else
              echo "::error::Failed to close temporary database ingress"
            fi
            return "$close_status"
          }
          trap close_ingress EXIT INT TERM
          ssl_config="$(supabase --experimental ssl-enforcement get --project-ref "$SUPABASE_PROJECT_REF")"
          jq -e '.currentConfig.database == true and .appliedSuccessfully == true' <<<"$ssl_config" >/dev/null \
            || { echo "::error::Supabase database SSL enforcement is disabled"; exit 1; }
          runner_ip="$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] \
            || { echo "::error::Cannot determine the backup runner IPv4 address"; exit 1; }
          supabase --experimental network-restrictions update \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --db-allow-cidr "$runner_ip/32" \
            --yes
          ingress_open=true
          db_url="$(printf '%s://%s:%s@%s:%s/%s?%s' \
            postgres postgres "$SUPABASE_ACCESS_TOKEN" \
            "db.${SUPABASE_PROJECT_REF}.supabase.co" 5432 postgres sslmode=require)"
          mkdir -p .backup-work/database
          supabase db dump --db-url "$db_url" -f .backup-work/database/roles.sql --role-only
          supabase db dump --db-url "$db_url" -f .backup-work/database/schema.sql
          supabase db dump \
            --db-url "$db_url" \
            -f .backup-work/database/data.sql \
            --use-copy \
            --data-only \
            --schema public \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"
          supabase db dump \
            --db-url "$db_url" \
            -f .backup-work/database/auth-data.sql \
            --use-copy \
            --data-only \
            --schema auth \
            -x "auth.audit_log_entries" \
            -x "auth.flow_state" \
            -x "auth.instances" \
            -x "auth.mfa_amr_claims" \
            -x "auth.mfa_challenges" \
            -x "auth.mfa_factors" \
            -x "auth.one_time_tokens" \
            -x "auth.refresh_tokens" \
            -x "auth.saml_providers" \
            -x "auth.saml_relay_states" \
            -x "auth.schema_migrations" \
            -x "auth.sessions" \
            -x "auth.sso_domains" \
            -x "auth.sso_providers"
          node scripts/verify-backup-export.mjs .backup-work/database
          tar -C .backup-work/database -czf .backup-work/whynavo-database.tar.gz \
            roles.sql schema.sql auth-data.sql data.sql
          close_ingress
          trap - EXIT INT TERM
      - name: Close direct database ingress
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          supabase --experimental network-restrictions update \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --db-allow-cidr "0.0.0.0/32" \
            --bypass-cidr-checks \
            --yes

      - name: Revoke temporary database access
        if: always() && env.JIT_USER_ID != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit/${JIT_USER_ID}" \
            >/dev/null
          if [ "${JIT_WAS_ENABLED:-false}" != "true" ]; then
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data '{"state":"disabled"}' \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/jit-access" \
              >/dev/null
          fi

      - name: Encrypt and validate backup
        env:
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          backup_id="$(date -u +'%Y-%m-%dT%H-%M-%SZ')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "BACKUP_ID=$backup_id" >> "$GITHUB_ENV"
          node scripts/backup-envelope.mjs \
            encrypt \
            .backup-work/whynavo-database.tar.gz \
            ".backup-work/${backup_id}.tar.gz.enc"
          node scripts/backup-envelope.mjs inspect ".backup-work/${backup_id}.tar.gz.enc"
          sha256sum ".backup-work/${backup_id}.tar.gz.enc" \
            > ".backup-work/${backup_id}.tar.gz.enc.sha256"

      - name: Upload ciphertext to private R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          prefix="production/$(date -u +'%Y/%m/%d')"
          aws s3 cp \
            ".backup-work/${BACKUP_ID}.tar.gz.enc" \
            "s3://${R2_BUCKET}/${prefix}/${BACKUP_ID}.tar.gz.enc" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/octet-stream \
            --no-progress
          aws s3 cp \
            ".backup-work/${BACKUP_ID}.tar.gz.enc.sha256" \
            "s3://${R2_BUCKET}/${prefix}/${BACKUP_ID}.tar.gz.enc.sha256" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain \
            --no-progress
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "${prefix}/${BACKUP_ID}.tar.gz.enc" \
            --endpoint-url "$R2_ENDPOINT" \
            --query '{ContentLength:ContentLength,ETag:ETag}' \
            --output json

      - name: Remove plaintext working files
        if: always()
        shell: bash
        run: |
          find .backup-work -type f -delete 2>/dev/null || true
          rm -rf .backup-work
