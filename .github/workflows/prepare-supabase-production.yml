name: Prepare WhyNavo Supabase Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whynavo-production-database-access
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify access token is present
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Apply backward-compatible migrations
        run: npm run deploy:supabase-migrations -- --through 0013

      - name: Apply WhyNavo identifier compatibility migration
        run: npm run deploy:supabase-migrations -- --only 0015

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0

      - name: Deploy reviewed Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api

      - name: Recheck production predeployment gates
        run: node scripts/verify-supabase-production.mjs --phase predeploy
