name: Deploy whytab Web App

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whytab-production-database-access
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify matching GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          gh release view "$release_version" --repo "$GITHUB_REPOSITORY"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Verify data migrations and security boundaries
        run: node scripts/migration-safety-test.mjs
      - name: Verify Edge Function syntax
        run: npm run verify:edge-functions
      - name: Verify encrypted backup tooling
        run: npm run verify:backup-tools
      - name: Verify repository privacy and public history
        run: |
          npm run verify:repository-safety
          npm run verify:public-images
          npm run verify:repository-history
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify official production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whytab.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whytab.pages.dev/captcha.html
        run: npm run verify:production-config
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whytab.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whytab.pages.dev/captcha.html
        run: npm run build:web
      - name: Apply backward-compatible database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations -- --through 0012
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy extension/web-dist --project-name=whytab --branch=main
      - name: Retire the unsupported sync API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations
      - name: Verify production security configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verify:supabase-production
      - name: Verify production deployment
        env:
          REQUIRE_PRODUCTION_CONFIG: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run smoke:hosted
