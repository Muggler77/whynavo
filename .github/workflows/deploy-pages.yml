name: Deploy WhyNavo Web App

on:
  workflow_call:
    inputs:
      activate_public_release:
        description: Publish the already-public release version in the hosted update manifest
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whynavo-production-database-access
  cancel-in-progress: false

jobs:
  build:
    if: vars.WHYNAVO_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify matching release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./package.json').version")"
          release_is_draft="$(gh release view "$release_version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "${{ inputs.activate_public_release }}" = "true" ]; then
            test "$release_is_draft" = "false" \
              || { echo "::error::Release activation requires an existing public release"; exit 1; }
          else
            test "$GITHUB_REF_TYPE" = "tag" && test "$GITHUB_REF_NAME" = "$release_version" \
              || { echo "::error::Release deployment must run from the matching version tag"; exit 1; }
            test "$release_is_draft" = "true" \
              || { echo "::error::Release deployment requires the matching private draft"; exit 1; }
          fi
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Configure reviewed Auth origin and rate limits
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run configure:supabase-auth
      - name: Verify data migrations and security boundaries
        run: node scripts/migration-safety-test.mjs
      - name: Verify Edge Function syntax
        run: npm run verify:edge-functions
      - name: Verify encrypted backup tooling
        run: npm run verify:backup-tools
      - name: Verify repository privacy and public history
        run: |
          npm run verify:repository-safety
          npm run verify:public-images
          npm run verify:repository-history
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
      - name: Verify official production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whynavo.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whynavo.pages.dev/captcha.html
        run: npm run verify:production-config
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_AUTH_REDIRECT_URL: https://whynavo.pages.dev/
          VITE_CAPTCHA_FRAME_URL: https://whynavo.pages.dev/captcha.html
        run: npm run build:web
      - name: Preserve the currently public update manifest during staged rollout
        if: github.event_name != 'workflow_dispatch' && inputs.activate_public_release != true
        run: node scripts/stage-live-version-manifest.mjs extension/web-dist/latest-version.json
      - name: Apply backward-compatible database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations -- --through 0013
      - name: Apply WhyNavo identifier compatibility migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations -- --only 0015
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify production predeployment gates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verify:supabase-production -- --phase predeploy
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy extension/web-dist --project-name=whynavo --branch=main
      - name: Verify hosted app before irreversible cutover
        env:
          REQUIRE_PRODUCTION_CONFIG: "1"
          ALLOW_PREVIOUS_VERSION_MANIFEST: ${{ github.event_name != 'workflow_dispatch' && inputs.activate_public_release != true && '1' || '0' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run smoke:hosted
      - name: Retire the unsupported sync API
        if: github.event_name == 'workflow_dispatch' || inputs.activate_public_release == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:supabase-migrations
      - name: Verify production security configuration
        if: github.event_name == 'workflow_dispatch' || inputs.activate_public_release == true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verify:supabase-production
      - name: Verify hosted app after irreversible cutover
        if: github.event_name == 'workflow_dispatch' || inputs.activate_public_release == true
        env:
          REQUIRE_PRODUCTION_CONFIG: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run smoke:hosted
