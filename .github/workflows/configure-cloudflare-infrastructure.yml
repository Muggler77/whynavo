name: Configure WhyNavo Cloudflare Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: whynavo
      PRODUCTION_DOMAIN: whynavo.com
      R2_BUCKET: whynavo-production-backups
    steps:
      - name: Verify Cloudflare credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Ensure Pages domain and private R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          response_file="${RUNNER_TEMP}/cloudflare-response.json"

          pages_status="$(curl --silent --show-error \
            --header "$auth_header" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${api}/pages/projects/${PAGES_PROJECT}/domains/${PRODUCTION_DOMAIN}")"
          if [ "$pages_status" = "404" ]; then
            pages_status="$(curl --silent --show-error \
              --request POST \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg name "$PRODUCTION_DOMAIN" '{name: $name}')" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "${api}/pages/projects/${PAGES_PROJECT}/domains")"
          fi
          [[ "$pages_status" =~ ^2[0-9][0-9]$ ]] \
            && jq -e '.success == true' "$response_file" >/dev/null \
            || { echo "::error::Could not ensure the Pages production domain (HTTP ${pages_status})"; exit 1; }
          pages_state="$(jq -r '.result.status // .result.verification_data.status // "pending"' "$response_file")"
          echo "Pages domain ${PRODUCTION_DOMAIN}: ${pages_state}"

          bucket_status="$(curl --silent --show-error \
            --header "$auth_header" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "${api}/r2/buckets/${R2_BUCKET}")"
          if [ "$bucket_status" = "404" ]; then
            bucket_status="$(curl --silent --show-error \
              --request POST \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "$(jq -cn --arg name "$R2_BUCKET" '{name: $name, locationHint: "apac", storageClass: "Standard"}')" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "${api}/r2/buckets")"
          fi
          [[ "$bucket_status" =~ ^2[0-9][0-9]$ ]] \
            && jq -e --arg name "$R2_BUCKET" '.success == true and .result.name == $name' "$response_file" >/dev/null \
            || { echo "::error::Could not ensure the private R2 backup bucket (HTTP ${bucket_status})"; exit 1; }
          echo "Private R2 bucket ${R2_BUCKET}: ready"

          rm -f "$response_file"
