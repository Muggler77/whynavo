name: Audit whytab Supabase Production

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Configuration phase to audit"
        required: true
        default: predeploy
        type: choice
        options:
          - predeploy
          - final

permissions:
  contents: read

concurrency:
  group: whytab-production-database-access
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: keafulupzvfljvbzwgrq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify access token is present
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Audit reviewed Supabase configuration
        run: node scripts/verify-supabase-production.mjs --phase "${{ inputs.phase }}"
