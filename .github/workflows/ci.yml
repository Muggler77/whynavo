name: Verify WhyNavo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Verify data migrations and security boundaries
        run: node scripts/migration-safety-test.mjs
      - name: Verify Edge Function syntax
        run: npm run verify:edge-functions
      - name: Verify encrypted backup tooling
        run: npm run verify:backup-tools
      - name: Verify repository privacy and secret boundaries
        run: |
          npm run verify:repository-safety
          npm run verify:public-images
      - name: Verify public repository history
        run: npm run verify:repository-history
      - name: Verify release metadata and update-manifest safety
        run: npm run verify:release
      - name: Build extension and web app
        run: npm run build:web
      - name: Audit runtime and build dependencies
        run: npm audit --audit-level=high
