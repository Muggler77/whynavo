name: Report WhyNavo Production Incidents

on:
  workflow_run:
    workflows: ["Monitor WhyNavo Production"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    if: vars.WHYNAVO_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Ensure incident label exists
        run: >-
          gh label create production-alert
          --color B60205
          --description "Automated production availability incident"
          --force
      - name: Open or resolve incident
        run: |
          open_issue="$(gh issue list --label production-alert --state open --json number --jq '.[0].number // empty')"
          if [ "$RUN_CONCLUSION" = "success" ]; then
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "Production checks recovered. Successful run: $RUN_URL"
            fi
            exit 0
          fi

          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "Production checks are still failing. Latest run: $RUN_URL"
          else
            gh issue create \
              --title "Production availability check failed" \
              --label production-alert \
              --body "The automated WhyNavo production check failed. Review the workflow logs without posting credentials or user data: $RUN_URL"
          fi
