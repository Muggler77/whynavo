name: Feature request
description: Suggest an improvement to WhyNavo.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and compatibility impact
      description: Note any expected effect on local data, cloud sync, backups, or older clients.
