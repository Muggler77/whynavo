name: Bug report
description: Report a reproducible WhyNavo problem without including private user data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, email verification links, access tokens, exported backup JSON, private notes, or screenshots containing personal data. Security vulnerabilities must use private vulnerability reporting instead of a public issue.
  - type: input
    id: version
    attributes:
      label: WhyNavo version
      placeholder: "0.7.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Hosted web app / PWA
        - Chrome extension
        - Edge extension
        - Other browser
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sample data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal data, credentials, verification links, tokens, and backup contents.
          required: true
