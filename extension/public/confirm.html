<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>确认 whytab 账号操作</title>
    <link rel="icon" href="./icons/icon128.png" />
    <link rel="stylesheet" href="./confirm.css" />
    <script src="./confirm.js" defer></script>
  </head>
  <body>
    <main class="confirmation-shell">
      <section class="confirmation-panel" aria-labelledby="confirmation-title">
        <img class="confirmation-logo" src="./icons/icon128.png" width="64" height="64" alt="whytab" />
        <p class="confirmation-brand">whytab</p>
        <h1 id="confirmation-title">确认账号操作</h1>
        <p class="confirmation-copy">
          这一步用于防止邮箱安全扫描程序提前使用一次性验证链接。仅在你本人刚刚注册、重置密码或修改账号信息时继续。
        </p>
        <p class="confirmation-copy" lang="en">
          Continue only if you recently requested this account action in whytab.
        </p>
        <p id="confirmation-status" class="confirmation-status" role="status" aria-live="polite">
          正在检查验证请求…
        </p>
        <button id="confirmation-continue" class="confirmation-button" type="button" disabled>
          确认并继续
        </button>
        <a class="confirmation-cancel" href="./">取消并返回 whytab</a>
      </section>
    </main>
  </body>
</html>
